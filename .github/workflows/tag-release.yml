name: Tag merged release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tag-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out merged release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Create immutable release tag
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_BRANCH#release/}"
          [[ "$tag" =~ ^v0\.[0-9]+\.0$ ]] || {
            echo "release branch must produce a v0.<minor>.0 tag" >&2
            exit 1
          }
          version=$(python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as stream:
              print(tomllib.load(stream)["project"]["version"])
          PY
          )
          test "$version" = "${tag#v}" || {
            echo "pyproject.toml version does not match release tag" >&2
            exit 1
          }
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$MERGE_SHA" origin/main || {
            echo "merged release commit is not contained in main" >&2
            exit 1
          }
          if git show-ref --tags --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-list -n1 "$tag^{commit}")" = "$MERGE_SHA" || {
              echo "release tag already points at another commit" >&2
              exit 1
            }
            echo "$tag already exists at $MERGE_SHA"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$tag" "$MERGE_SHA" --message "$tag"
          git push origin "$tag"
