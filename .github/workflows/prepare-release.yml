name: Prepare release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.22"
          enable-cache: true

      - name: Compute next release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          current=$(python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as stream:
              print(tomllib.load(stream)["project"]["version"])
          PY
          )
          [[ "$current" =~ ^0\.([0-9]+)\.0$ ]] || {
            echo "pyproject.toml version must match 0.<minor>.0" >&2
            exit 1
          }
          next="0.$((10#${BASH_REMATCH[1]} + 1)).0"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "branch=release/v$next" >> "$GITHUB_OUTPUT"

      - name: Create or update release pull request
        id: release_pr
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_BRANCH: ${{ steps.version.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          existing_pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main \
            --head "$RELEASE_BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$existing_pr" ]; then
            echo "pr_number=$existing_pr" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git switch --create "$RELEASE_BRANCH"
          VERSION="$VERSION" python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text()
          version = os.environ["VERSION"]
          updated, count = re.subn(
              r'^version = "0\.[0-9]+\.0"$',
              f'version = "{version}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("expected exactly one project version")
          path.write_text(updated)
          PY
          uv lock
          if git diff --name-only | grep -Evx '(pyproject\.toml|uv\.lock)'; then
            echo "release preparation changed files outside pyproject.toml and uv.lock" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "chore(release): $VERSION"
          git push --set-upstream origin "$RELEASE_BRANCH"
          pr_number=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$RELEASE_BRANCH" \
            --title "chore(release): $VERSION" \
            --body "Automated release preparation for MALG $VERSION. Required PR checks must pass before merge.")
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Dispatch release checks and request auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.version.outputs.branch }}
          PR_NUMBER: ${{ steps.release_pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_BRANCH"
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash

      - name: Tag merged release and dispatch publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PR_NUMBER: ${{ steps.release_pr.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          merge_sha=""
          for attempt in $(seq 1 60); do
            merge_sha=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json state,mergeCommit --jq 'select(.state == "MERGED") | .mergeCommit.oid')
            if [ -n "$merge_sha" ]; then
              break
            fi
            sleep 10
          done
          test -n "$merge_sha" || {
            echo "release PR did not auto-merge within the bounded wait" >&2
            exit 1
          }
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$merge_sha" origin/main || {
            echo "release merge commit is not contained in main" >&2
            exit 1
          }
          if git show-ref --tags --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-list -n1 "$RELEASE_TAG^{commit}")" = "$merge_sha" || {
              echo "release tag already points at another commit" >&2
              exit 1
            }
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$RELEASE_TAG" "$merge_sha" --message "$RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=publish-release -F "client_payload[tag]=$RELEASE_TAG"
