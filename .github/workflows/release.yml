name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out resulting main with tags
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.22"
          enable-cache: true


      - name: Compute and commit next version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          current=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("pyproject.toml").read_text()
          match = re.search(r'^version = "([^"]+)"$', text, re.MULTILINE)
          if match is None or not re.fullmatch(r"0\.[0-9]+\.0", match.group(1)):
              raise SystemExit("pyproject.toml version must strictly match 0.<minor>.0")
          print(match.group(1))
          PY
          )
          minor=${current#0.}
          minor=${minor%.0}
          next="0.$((minor + 1)).0"
          VERSION="$next" python - <<'PY'
          import os
          import re
          from pathlib import Path
          path = Path("pyproject.toml")
          text = path.read_text()
          next_version = os.environ["VERSION"]
          updated, count = re.subn(
              r'^version = "0\.[0-9]+\.0"$',
              'version = "' + next_version + '"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("expected exactly one project version")
          path.write_text(updated)
          PY
          uv lock
          if git diff --name-only | grep -Evx '(pyproject\.toml|uv\.lock)'; then
            echo "release workflow changed files outside pyproject.toml and uv.lock" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "chore(release): $next"
          git tag -a "v$next" -m "v$next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Capture release ref
        id: release_ref
        shell: bash
        run: |
          set -euo pipefail
          echo "tag=v${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/noxels/malg:${{ steps.release_ref.outputs.tag }}
            ghcr.io/noxels/malg:${{ steps.release_ref.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release_ref.outputs.sha }}
            org.opencontainers.image.version=${{ steps.release_ref.outputs.tag }}
          sbom: true
          provenance: mode=max

      - name: Build and push frontend image
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          build-args: |
            MALG_VERSION=${{ steps.release_ref.outputs.tag }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/noxels/malg-frontend:${{ steps.release_ref.outputs.tag }}
            ghcr.io/noxels/malg-frontend:${{ steps.release_ref.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release_ref.outputs.sha }}
            org.opencontainers.image.version=${{ steps.release_ref.outputs.tag }}
          sbom: true
          provenance: mode=max

      - name: Generate immutable release metadata
        id: release_metadata
        env:
          VERSION: ${{ steps.release_ref.outputs.tag }}
          SOURCE_SHA: ${{ steps.release_ref.outputs.sha }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$BACKEND_DIGEST" && test -n "$FRONTEND_DIGEST"
          [[ "$BACKEND_DIGEST" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "backend digest is not immutable" >&2; exit 1; }
          [[ "$FRONTEND_DIGEST" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "frontend digest is not immutable" >&2; exit 1; }
          contract_version=$(uv run python -c 'from malg.crm.schema import load_manifest; print(load_manifest()["contract_version"])')
          contract_hash=$(uv run python -c 'from malg.crm.schema import contract_hash; print(contract_hash())')
          required_database_revision=$(uv run python -c 'from malg.database.wait_for_schema import REQUIRED_DATABASE_REVISION; print(REQUIRED_DATABASE_REVISION)')
          test "$required_database_revision" = "20260924_01"
          export VERSION SOURCE_SHA BACKEND_DIGEST FRONTEND_DIGEST contract_version contract_hash required_database_revision
          python - <<'PY'
          import json, os
          from pathlib import Path
          output = {
              "release_tag": os.environ["VERSION"],
              "source_sha": os.environ["SOURCE_SHA"],
              "backend_image": f"ghcr.io/noxels/malg:{os.environ['VERSION']}@{os.environ['BACKEND_DIGEST']}",
              "frontend_image": f"ghcr.io/noxels/malg-frontend:{os.environ['VERSION']}@{os.environ['FRONTEND_DIGEST']}",
              "contract_version": int(os.environ["contract_version"]),
              "contract_hash": os.environ["contract_hash"],
              "required_database_revision": os.environ["required_database_revision"],
          }
          Path("malg-release.json").write_text(json.dumps(output, indent=2, sort_keys=True) + "\n")
          PY
          test "$(python -c 'import json; print(len(json.load(open("malg-release.json"))))')" -eq 7

      - name: Push release commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git push origin HEAD:main
          git push origin "v$VERSION"

          CONTRACT_HASH=$(uv run python -c 'from malg.crm.schema import contract_hash; print(contract_hash())')
          {
            echo "Contract version/hash:"
            echo "- contract_version: $(uv run python -c 'from malg.crm.schema import load_manifest; print(load_manifest()[\"contract_version\"])')"
            echo "- contract_hash: $CONTRACT_HASH"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release with immutable digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release_ref.outputs.tag }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" malg-release.json --generate-notes --title "$VERSION" --notes "Published image digests:
          - ghcr.io/noxels/malg@$BACKEND_DIGEST
          - ghcr.io/noxels/malg-frontend@$FRONTEND_DIGEST"
