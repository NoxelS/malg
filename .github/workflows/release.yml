name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out resulting main with tags
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.22"
          enable-cache: true


      - name: Compute and commit next version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          current=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("pyproject.toml").read_text()
          match = re.search(r'^version = "([^"]+)"$', text, re.MULTILINE)
          if match is None or not re.fullmatch(r"0\.[0-9]+\.0", match.group(1)):
              raise SystemExit("pyproject.toml version must strictly match 0.<minor>.0")
          print(match.group(1))
          PY
          )
          minor=${current#0.}
          minor=${minor%.0}
          next="0.$((minor + 1)).0"
          VERSION="$next" python - <<'PY'
          import os
          import re
          from pathlib import Path
          path = Path("pyproject.toml")
          text = path.read_text()
          next_version = os.environ["VERSION"]
          updated, count = re.subn(
              r'^version = "0\.[0-9]+\.0"$',
              'version = "' + next_version + '"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("expected exactly one project version")
          path.write_text(updated)
          PY
          uv lock
          if git diff --name-only | grep -Evx '(pyproject\.toml|uv\.lock)'; then
            echo "release workflow changed files outside pyproject.toml and uv.lock" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "chore(release): $next"
          git tag -a "v$next" -m "v$next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Capture release ref
        id: release_ref
        shell: bash
        run: |
          set -euo pipefail
          echo "tag=v${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/noxels/malg:${{ steps.release_ref.outputs.tag }}
            ghcr.io/noxels/malg:${{ steps.release_ref.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release_ref.outputs.sha }}
            org.opencontainers.image.version=${{ steps.release_ref.outputs.tag }}
          sbom: true
          provenance: mode=max

      - name: Build and push frontend image
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          build-args: |
            MALG_VERSION=${{ steps.release_ref.outputs.tag }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/noxels/malg-frontend:${{ steps.release_ref.outputs.tag }}
            ghcr.io/noxels/malg-frontend:${{ steps.release_ref.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release_ref.outputs.sha }}
            org.opencontainers.image.version=${{ steps.release_ref.outputs.tag }}
          sbom: true
          provenance: mode=max

      - name: Push release commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git push origin HEAD:main
          git push origin "v$VERSION"

      - name: Create GitHub release with immutable digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release_ref.outputs.tag }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" --generate-notes --title "$VERSION" --notes "Published image digests:
          - ghcr.io/noxels/malg@$BACKEND_DIGEST
          - ghcr.io/noxels/malg-frontend@$FRONTEND_DIGEST"
