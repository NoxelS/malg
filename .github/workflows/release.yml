name: Release

on:
  push:
    tags: ["v*"]
  repository_dispatch:
    types: [publish-release]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.client_payload.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify reviewed release tag
        id: release_ref
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.client_payload.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v0\.[0-9]+\.0$ ]] || {
            echo "release tag must match v0.<minor>.0" >&2
            exit 1
          }
          git fetch origin main --no-tags
          tag_sha=$(git rev-parse "$RELEASE_TAG^{commit}")
          main_sha=$(git rev-parse origin/main)
          git merge-base --is-ancestor "$tag_sha" "$main_sha" || {
            echo "tag commit is not contained in origin/main" >&2
            exit 1
          }
          version=$(python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as stream:
              print(tomllib.load(stream)["project"]["version"])
          PY
          )
          test "$version" = "${RELEASE_TAG#v}" || {
            echo "pyproject.toml version does not match tag" >&2
            exit 1
          }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$tag_sha" >> "$GITHUB_OUTPUT"


      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/noxels/malg:${{ steps.release_ref.outputs.tag }}
            ghcr.io/noxels/malg:${{ steps.release_ref.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release_ref.outputs.sha }}
            org.opencontainers.image.version=${{ steps.release_ref.outputs.tag }}
          sbom: true
          provenance: mode=max

      - name: Build and push frontend image
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          build-args: |
            MALG_VERSION=${{ steps.release_ref.outputs.tag }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/noxels/malg-frontend:${{ steps.release_ref.outputs.tag }}
            ghcr.io/noxels/malg-frontend:${{ steps.release_ref.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release_ref.outputs.sha }}
            org.opencontainers.image.version=${{ steps.release_ref.outputs.tag }}
          sbom: true
          provenance: mode=max
      - name: Verify published image digests
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$BACKEND_DIGEST" && test -n "$FRONTEND_DIGEST"
          [[ "$BACKEND_DIGEST" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "backend digest is not immutable" >&2; exit 1; }
          [[ "$FRONTEND_DIGEST" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "frontend digest is not immutable" >&2; exit 1; }



      - name: Create GitHub release with immutable digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release_ref.outputs.tag }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" --generate-notes --title "$VERSION" --notes "Published image digests:
          - ghcr.io/noxels/malg@$BACKEND_DIGEST
          - ghcr.io/noxels/malg-frontend@$FRONTEND_DIGEST"
