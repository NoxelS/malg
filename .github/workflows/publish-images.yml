name: Publish images

on:
  push:
    tags:
      - 'v0.*.0'
  workflow_dispatch:
permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert package version matches tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected=${TAG#v}
          actual=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("pyproject.toml").read_text()
          match = re.search(r'^version = "([^"]+)"$', text, re.MULTILINE)
          if match is None:
              raise SystemExit("missing project version")
          print(match.group(1))
          PY
          )
          [[ "$actual" == "$expected" ]] || { echo "version $actual does not match tag $expected" >&2; exit 1; }
          [[ "$expected" =~ ^0\.[0-9]+\.0$ ]] || { echo "release tag must match v0.<minor>.0" >&2; exit 1; }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/noxels/malg:${{ github.ref_name }}
            ghcr.io/noxels/malg:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          sbom: true
          provenance: mode=max

      - name: Build and push frontend image
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          build-args: |
            MALG_VERSION=${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/noxels/malg-frontend:${{ github.ref_name }}
            ghcr.io/noxels/malg-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          sbom: true
          provenance: mode=max

      - name: Create GitHub release with immutable digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" --generate-notes --title "$VERSION" --notes "Published image digests:
          - ghcr.io/noxels/malg@$BACKEND_DIGEST
          - ghcr.io/noxels/malg-frontend@$FRONTEND_DIGEST"
