name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || 'main' }}
  queue: max

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.22"
          enable-cache: true

      - name: Check locked dependencies
        run: uv sync --locked --group dev

      - name: Run Python checks
        run: make check

      - name: Validate image build contexts
        shell: bash
        run: |
          set -euo pipefail
          test -f .dockerignore
          for path in .env memory results; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "runtime data or user configuration is tracked: $path" >&2
              exit 1
            fi
          done
          grep -Fxq 'memory' .dockerignore
          grep -Fxq 'results' .dockerignore
          test -f frontend/.dockerignore
          test ! -e frontend/user.config.toml
          test ! -e frontend/.env
          grep -Fxq 'node_modules' frontend/.dockerignore
          grep -Fxq 'dist' frontend/.dockerignore

  postgres-integration:
    name: PostgreSQL and pgvector integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: malg
          POSTGRES_PASSWORD: malg
          POSTGRES_DB: malg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U malg -d malg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.22"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Apply PostgreSQL migrations
        env:
          DATABASE_URL: postgresql+psycopg://malg:malg@127.0.0.1:5432/malg
          MALG_CRM_CUTOVER_APPROVED: "1"
        run: uv run alembic upgrade head

      - name: Run PostgreSQL memory and API integration tests
        env:
          DATABASE_URL: postgresql+psycopg://malg:malg@127.0.0.1:5432/malg
        run: uv run pytest tests/test_postgres_memory.py -q

  build:
    name: Build images
    if: github.event_name == 'pull_request'
    needs: [check, postgres-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build backend image without pushing
        run: docker build --file docker/Dockerfile --tag malg:ci .

      - name: Build frontend image without pushing
        run: docker build --file frontend/Dockerfile --tag malg-frontend:ci frontend

  publish:
    name: Publish images and release
    if: github.event_name == 'push'
    needs: [check, postgres-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Select and reserve release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main

          current_tags=()
          highest_minor=0
          highest_tag=""
          while IFS= read -r candidate; do
            [[ "$candidate" =~ ^v0\.([1-9][0-9]*)\.0$ ]] || continue
            minor="${BASH_REMATCH[1]}"
            if (( 10#$minor > highest_minor )); then
              highest_minor=$((10#$minor))
              highest_tag="$candidate"
            fi
            candidate_sha=$(git rev-parse "$candidate^{commit}")
            if [[ "$candidate_sha" = "$GITHUB_SHA" ]]; then
              current_tags+=("$candidate")
            fi
          done < <(git tag --list 'v0.*.0')

          if (( ${#current_tags[@]} > 1 )); then
            printf 'current commit has multiple release tags: %s\n' "${current_tags[*]}" >&2
            exit 1
          fi

          if (( ${#current_tags[@]} == 1 )); then
            RELEASE_TAG="${current_tags[0]}"
          else
            if [[ -n "$highest_tag" ]]; then
              highest_sha=$(git rev-parse "$highest_tag^{commit}")
              if git merge-base --is-ancestor "$GITHUB_SHA" "$highest_sha"; then
                echo "publish=false" >> "$GITHUB_OUTPUT"
                echo "$GITHUB_SHA is already superseded by release $highest_tag"
                exit 0
              fi
              git merge-base --is-ancestor "$highest_sha" "$GITHUB_SHA" || {
                echo "main history diverges from release $highest_tag" >&2
                exit 1
              }
            fi
            RELEASE_TAG="v0.$((highest_minor + 1)).0"
          fi

          [[ "$RELEASE_TAG" =~ ^v0\.[1-9][0-9]*\.0$ ]]

          resolve_tag_sha() {
            local object_sha object_type
            IFS=$'\t' read -r object_sha object_type < <(
              gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
                --jq '[.object.sha, .object.type] | @tsv'
            )
            for _ in 1 2 3 4 5; do
              if [[ "$object_type" = commit ]]; then
                printf '%s\n' "$object_sha"
                return 0
              fi
              [[ "$object_type" = tag ]] || return 1
              IFS=$'\t' read -r object_sha object_type < <(
                gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                  --jq '[.object.sha, .object.type] | @tsv'
              )
            done
            return 1
          }

          publish=true
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            publish=false
          fi

          if tag_sha=$(resolve_tag_sha 2>/dev/null); then
            test "$tag_sha" = "$GITHUB_SHA" || {
              echo "$RELEASE_TAG already resolves to $tag_sha, not $GITHUB_SHA" >&2
              exit 1
            }
          elif gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA" >/dev/null; then
            echo "reserved $RELEASE_TAG at $GITHUB_SHA"
          else
            tag_sha=$(resolve_tag_sha) || {
              echo "could not create or resolve $RELEASE_TAG" >&2
              exit 1
            }
            test "$tag_sha" = "$GITHUB_SHA" || {
              echo "$RELEASE_TAG already resolves to $tag_sha, not $GITHUB_SHA" >&2
              exit 1
            }
          fi

          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Verify release identity
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v0\.[1-9][0-9]*\.0$ ]]
          test "$GITHUB_REF" = refs/heads/main

      - name: Set up QEMU
        if: steps.release.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.release.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        if: steps.release.outputs.publish == 'true'
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/noxels/malg:${{ steps.release.outputs.tag }}
            ghcr.io/noxels/malg:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
          sbom: true
          provenance: mode=max

      - name: Build and push frontend image
        if: steps.release.outputs.publish == 'true'
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          build-args: |
            MALG_VERSION=${{ steps.release.outputs.tag }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/noxels/malg-frontend:${{ steps.release.outputs.tag }}
            ghcr.io/noxels/malg-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
          sbom: true
          provenance: mode=max

      - name: Verify published image digests
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$BACKEND_DIGEST" =~ ^sha256:[0-9a-fA-F]{64}$ ]]
          [[ "$FRONTEND_DIGEST" =~ ^sha256:[0-9a-fA-F]{64}$ ]]

      - name: Create GitHub release
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$RELEASE_TAG was already published"
            exit 0
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --generate-notes --title "$RELEASE_TAG" \
            --notes "Published image digests:
          - ghcr.io/noxels/malg@$BACKEND_DIGEST
          - ghcr.io/noxels/malg-frontend@$FRONTEND_DIGEST"
