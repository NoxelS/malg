[project]
name = "malg"
version = "0.1.0"
description = "Multi Agent Lead Generation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dynaconf>=3.2",
    "nooa",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["malg"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["malg"]
