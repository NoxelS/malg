[default.auth]
username = "admin"
password = ""

[default.llm]
model = "gpt-4.1-mini"
api_base = "https://api.openai.com/v1"
api_key = "<YOUR_OPENAI_API_KEY>"
request_timeout_seconds = 90
# Research retries are host-owned and bounded; the client performs at most one.
max_retries = 1
context_window = 262144
max_tokens = 32768
headroom_compression = false
parallel_tool_calls = false
enable_thinking = false
 

[default.browser]
enabled = true
url = "http://lightpanda:9223/mcp"
timeout_seconds = 6000

[default.search]
enabled = true
url = "http://searxng:8080"
timeout_seconds = 20
max_results = 20
max_requests_per_run = 50
min_interval_seconds = 2.0
languages = ["en", "de"]
categories = ["general"]

[default.eurostat]
timeout_seconds = 6000
proxy = ""
verify = true
cert = ""

[default.icp]
batch_size = 250 
concurrency = 3
max_attempts_per_slot = 3
max_exclusion_cards = 100

[default.worker]
poll_interval_seconds = 1
lease_seconds = 30
max_attempts = 3
heartbeat_timeout_seconds = 15

[default.research]
workflow_timeout_seconds = 600
stage_timeout_seconds = 180
qualification_timeout_seconds = 180
project_timeout_seconds = 120
contact_timeout_seconds = 180
review_timeout_seconds = 90
llm_attempt_timeout_seconds = 90
initialization_timeout_seconds = 20
cleanup_reserve_seconds = 5
max_iterations = 6
max_llm_attempts_per_stage = 12
max_llm_attempts_per_workflow = 24
max_search_requests = 12
max_fetch_requests = 20
discovery_batch_size = 10
max_discovery_candidates = 20
extraction_enable_thinking = false
synthesis_enable_thinking = false
thinking_supported = false
