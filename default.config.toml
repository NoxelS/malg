[default.llm]
model = "gpt-4.1-mini"
provider = "openai"
api_base = "https://api.openai.com/v1"
api_key = "<YOUR_OPENAI_API_KEY>"

[default.browser]
enabled = true
url = "http://lightpanda:9223/mcp"
timeout_seconds = 60

[default.eurostat]
timeout_seconds = 120
proxy = ""
verify = true
cert = ""

[default.pipeline]
output_root = "results"
# Number of lightweight market hypotheses to discover and assess.
market_count = 5
# Generate an ICP for every scored market. Set a positive integer to limit the run.
top_n = 5
overwrite = false
