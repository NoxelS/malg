[default.auth]
username = "admin"
password = ""

[default.llm]
model = "gpt-4.1-mini"
api_base = "https://api.openai.com/v1"
api_key = "<YOUR_OPENAI_API_KEY>"
request_timeout_seconds = 90
# Research retries are host-owned and bounded; the client performs at most one.
max_retries = 1
context_window = 262144
max_tokens = 32768
headroom_compression = false
parallel_tool_calls = false
enable_thinking = false
 

[default.twenty]
base_url = "http://twenty.twenty.svc.cluster.local:3000"
public_url = "https://twenty.noel.fyi"
api_key = ""
workspace_id = ""
timeout_seconds = 15
max_retries = 2

[default.twenty_schema]
api_key = ""

[default.browser]
enabled = true
url = "http://lightpanda:9223/mcp"
timeout_seconds = 6000

[default.search]
enabled = true
url = "http://searxng:8080"
timeout_seconds = 20
max_results = 20
max_requests_per_run = 50
min_interval_seconds = 2.0
languages = ["en", "de"]
categories = ["general"]

[default.eurostat]
timeout_seconds = 6000
proxy = ""
verify = true
cert = ""

[default.worker]
poll_interval_seconds = 1
lease_seconds = 30
max_attempts = 3
heartbeat_timeout_seconds = 15

[default.research]
# Account research is intentionally allowed to investigate and recover from
# weak candidates. Limits remain finite so cancellation and worker recovery
# still have a reliable boundary.
workflow_timeout_seconds = 7200
stage_timeout_seconds = 3600
llm_attempt_timeout_seconds = 600
initialization_timeout_seconds = 90
cleanup_reserve_seconds = 60
max_iterations = 512
max_llm_attempts_per_stage = 256
max_llm_attempts_per_workflow = 512
max_search_requests = 1000
max_fetch_requests = 2000
max_account_candidates_per_company = 10
