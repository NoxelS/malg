[default.llm]
model = "gpt-4.1-mini"
provider = "openai"
api_base = "https://api.openai.com/v1"
api_key = "<YOUR_OPENAI_API_KEY>"
request_timeout_seconds = 300

[default.browser]
enabled = true
url = "http://lightpanda:9223/mcp"
timeout_seconds = 600

[default.search]
enabled = true
url = "http://searxng:8080"
timeout_seconds = 20
max_results = 20
max_requests_per_run = 50
min_interval_seconds = 2.0
languages = ["en", "de"]
categories = ["general"]

[default.eurostat]
timeout_seconds = 600
proxy = ""
verify = true
cert = ""
