[default.auth]
username = "admin"
password = ""

[default.llm]
model = "gpt-4.1-mini"
api_base = "https://api.openai.com/v1"
api_key = "<YOUR_OPENAI_API_KEY>"
request_timeout_seconds = 6000
# Retry client and gateway timeout responses after their server-directed delay,
# or with a bounded exponential fallback when no delay is provided.
max_retries = 3
context_window = 262144
max_tokens = 32768
headroom_compression = false
parallel_tool_calls = false

[default.browser]
enabled = true
url = "http://lightpanda:9223/mcp"
timeout_seconds = 6000

[default.search]
enabled = true
url = "http://searxng:8080"
timeout_seconds = 20
max_results = 20
max_requests_per_run = 50
min_interval_seconds = 2.0
languages = ["en", "de"]
categories = ["general"]

[default.eurostat]
timeout_seconds = 6000
proxy = ""
verify = true
cert = ""

[default.icp]
batch_size = 250 
concurrency = 3
max_attempts_per_slot = 3
max_exclusion_cards = 100

[default.worker]
poll_interval_seconds = 1
lease_seconds = 7200
max_attempts = 3
heartbeat_timeout_seconds = 15
