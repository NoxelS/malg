# Explicit opt-in compatibility environment; never points at production.
services:
  twenty-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: twenty
      POSTGRES_USER: twenty
      POSTGRES_PASSWORD: twenty-local-only
    volumes:
      - twenty-postgres:/var/lib/postgresql/data
  twenty-redis:
    image: redis:7-alpine
  twenty-minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    command: server /data
    environment:
      MINIO_ROOT_USER: twenty
      MINIO_ROOT_PASSWORD: twenty-local-only
  twenty:
    image: twentycrm/twenty:v2.41.0@sha256:47bcefe4e497ceef232f149153a4a61379830f5c898b7da71a5b0e21fd5ea916
    depends_on:
      - twenty-postgres
      - twenty-redis
      - twenty-minio
    environment:
      PG_DATABASE_URL: postgresql://twenty:twenty-local-only@twenty-postgres:5432/twenty
      REDIS_URL: redis://twenty-redis:6379
      SERVER_URL: http://localhost:3000
      STORAGE_TYPE: s3
      STORAGE_S3_ENDPOINT: http://twenty-minio:9000
      STORAGE_S3_ACCESS_KEY_ID: twenty
      STORAGE_S3_SECRET_ACCESS_KEY: twenty-local-only
      STORAGE_S3_REGION: us-east-1
    ports:
      - "127.0.0.1:3000:3000"
volumes:
  twenty-postgres:
